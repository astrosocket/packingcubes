[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "setuptools-scm>=8.1",
]

[project]
name = "packingcubes"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "h5py",
    "numba",
    "xxhash>=4.0.1,<5",
]
authors = [
    {name = "Michael Ryan"},
    {name = "Josh Borrow", email="josh@joshborrow.com"}
]
description="PackingCubes octree implementation for astro data"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["astronomy", "astrophysics"]
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version","readme"]

[project.urls]
home = "https://packingcubes.readthedocs.io"
source = "https://github.com/astrosocket/packingcubes"
issues = "https://github.com/astrosocket/packingcubes/issues/new"

[project.optional-dependencies]
viz = [
    "matplotlib", "pygfx", "rendercanvas", "pyside6",
]
jupyter = [
    "jupyter-rfb",
]
all = ["packingcubes[viz]", "packingcubes[jupyter]",]

[project.scripts]
packcubes = "packingcubes.cubes.cubes_creation:cli"
packcubes_viz_demo = "packingcubes.demo:main"



[dependency-groups]
test = [
    "pytest",
    "hypothesis"
]
profile = [
    "pyinstrument", "scalene>=1.5.55,<2", "profila>=0.3.4,<0.4",
]
benchmark = ["scipy", "unyt", "matplotlib"]
jupyter = [
    "ipywidgets",
    "ipykernel",
    "ipympl",
]
build = ["setuptools", "wheel>=0.48.0,<0.49", "build>=1.6.1,<2", "setuptools-scm>=10.3.4,<11", "twine"]
dev = [
    "ruff",
    "pre-commit",
    "coverage",
    "pytest-cov",
    "mypy",
    "packingcubes[all]",
    {include-group = "test"},
    {include-group = "profile"},
    {include-group = "jupyter"},
    "matplotlib",
    "pygfx",
    "rendercanvas",
    "pyside6",
    "jupyter-rfb",
    "pytest",
    "hypothesis",
    "pyinstrument",
    "scalene>=1.5.55,<2",
    "profila>=0.3.4,<0.4",
    "ipywidgets",
    "ipykernel",
    "ipympl",
]
docs = ["griffe-pydantic", "zensical", "mkdocstrings-python", "mkdocstrings"]
all = ["matplotlib", "pygfx", "rendercanvas", "pyside6", "jupyter-rfb"]

[tool.setuptools]
packages = ["packingcubes"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type="text/markdown"}

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # additional flake8
    "FBT","C","A","FA","ICN","LOG","T","PT","Q","RET",
    # isort
    "I",
    # McCabe Complexity
    "C90",
    # numpy
    "NPY",
    # Docstrings
    "D",
    # "DOC", # only available in ruff preview for now
]
ignore = ["F841", "SIM300", "D400", "ICN001"]
unfixable = ["B"]


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
source = [
    "packingcubes",
]
omit=[
    "packingcubes/_version.py",
]
core="ctrace"

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]

[[tool.mypy.overrides]]
module = ["numba.*"]
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
packingcubes = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["test","viz","jupyter","dev","profile"], solve-group = "default" }
test = { features = ["test","viz", "jupyter"], solve-group = "default" }
viz = { features = ["viz", "jupyter"], solve-group = "default" }
jupyter = { features = ["jupyter"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
docs = { features = ["docs", "jupyter"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.feature.docs.tasks]
zserve = "zensical serve"
zbuild = "zensical build"

[tool.pixi.feature.dev.tasks]
test = {cmd = "pytest --cov=packingcubes", env = { NUMBA_JIT_COVERAGE="1" }}
bench = "python -m benchmarks.performance.timing"
plotbench = "python -m benchmarks.performance.plot_timings"
format = "ruff format"
check = "ruff check --fix"
lint = "mypy -p packingcubes"
style = [{task="format"}, {task="check"}, {task="lint"}]

[tool.pixi.feature.dev.dependencies]
pytest-cov = ">=7.1.0,<8"
ruff = ">=0.17.1,<0.18"
pre-commit = ">=4.7.0,<5"
coverage = ">=7.16.2,<8"
mypy = ">=2.4.0,<3"
scipy = ">=1.18.1,<2"
yt = ">=4.4.2,<5"
pykdtree = ">=1.4.3,<2"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"
hypothesis = ">=6.170.0,<7"

[tool.pixi.feature.profile.dependencies]
pyinstrument = ">=5.1.3,<6"
pympler = ">=1.1,<2"

[tool.pixi.feature.viz.dependencies]
matplotlib = ">=3.11.2,<4"
pygfx = ">=0.17.0,<0.18"
wgpu-py = ">=0.32.0,<0.33"
rendercanvas = ">=2.7.2,<3"
pyside6 = ">=6.11.2,<7"

[tool.pixi.feature.jupyter.dependencies]
ipykernel = ">=7.4.0,<8"
ipympl = ">=0.10.0,<0.11"
ipywidgets = ">=8.1.9,<9"
jupyter-rfb = ">=1.0.2,<2"

[tool.pixi.feature.build.dependencies]
twine = ">=7.0.0,<8"

[tool.pixi.feature.docs.dependencies]
zensical = ">=0.0.70,<0.0.71"
mkdocstrings = ">=1.0.7,<2"
mkdocstrings-python = ">=2.0.8,<3"
griffe-pydantic = ">=1.3.2,<2"

[tool.pixi.dependencies]
numpy = ">=2.5.4,<3"
h5py = ">=3.16.0,<4"
numba = ">=0.68.0,<0.69"
xxhash = ">=0.8.3,<0.9"
